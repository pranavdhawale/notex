services:
  # Database Services
  mongo:
    image: bitnami/mongodb:latest
    container_name: notex-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/bitnami/mongodb
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - notex-dev-net

  # Object Storage Service
  minio:
    image: minio/minio:latest
    container_name: notex-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    networks:
      - notex-dev-net

  # Backend Service
  server:
    build:
      context: ./server
      target: development
    container_name: notex-server
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app # Mount source for hot reloading
    environment:
      - PORT=8080
      - GIN_MODE=debug
      - MONGO_URI=mongodb://mongo:27017
      - CLIENT_ORIGIN=http://localhost:5173
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_USE_SSL=false
      - MINIO_BUCKET=notex-uploads
    depends_on:
      - mongo
      - minio
    networks:
      - notex-dev-net

  # Frontend Service
  client:
    build:
      context: ./client
      target: development
    container_name: notex-client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app # Mount source for hot reloading
      - /app/node_modules # Prevent host node_modules from overwriting container's
    environment:
      - VITE_API_URL=http://localhost:8080
    networks:
      - notex-dev-net

volumes:
  mongo_data:
  minio_data:

networks:
  notex-dev-net:
    driver: bridge